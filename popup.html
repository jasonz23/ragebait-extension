<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ragebait Radar</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d1a;
      --bg-secondary: #12162a;
      --card: rgba(255, 255, 255, 0.08);
      --card-strong: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f5f7ff;
      --muted: rgba(245, 247, 255, 0.7);
      --accent: #7c5cff;
      --accent-strong: #9b7bff;
      --accent-soft: rgba(124, 92, 255, 0.25);
      --danger: #f43f5e;
      --success: #22c55e;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      padding: 18px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, rgba(124, 92, 255, 0.35), transparent 55%),
        linear-gradient(180deg, #0b0d1a 0%, #0c1024 100%);
      color: var(--text);
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .title span {
      font-size: 12px;
      color: var(--muted);
    }

    .badge {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toggle-row span {
      font-size: 13px;
      color: var(--muted);
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: 0.2s;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 2px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: rgba(34, 197, 94, 0.4);
      border-color: rgba(34, 197, 94, 0.6);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      background: var(--card-strong);
      padding: 4px;
      border-radius: 999px;
    }

    .tab-button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-button.active {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .form input {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(10, 14, 30, 0.6);
      color: var(--text);
      font-size: 13px;
    }

    .form input::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      box-shadow: 0 10px 20px rgba(124, 92, 255, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text);
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.16);
      color: #fecdd3;
      border: 1px solid rgba(244, 63, 94, 0.4);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      padding: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stat h3 {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat span {
      font-size: 16px;
      font-weight: 700;
    }

    .stat-wide {
      grid-column: span 2;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      display: none;
      margin-top: 6px;
    }

    .status.show {
      display: block;
    }

    .footer-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">
        <h1>Ragebait Radar</h1>
        <span>Track hype, hopium, and neutral vibes</span>
      </div>
      <span class="badge">LIVE</span>
    </div>

    <div class="card">
      <div class="toggle-row">
        <span>Extension Enabled</span>
        <label class="toggle-switch">
          <input type="checkbox" id="enableToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card" id="authCard">
      <div id="authForms">
        <div class="tabs">
          <button class="tab-button active" data-tab="login">Log In</button>
          <button class="tab-button" data-tab="signup">Sign Up</button>
        </div>

        <form class="form" id="loginForm">
          <div>
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="you@email.com" required>
          </div>
          <div>
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <button class="btn-primary" type="submit">Log In</button>
        </form>

        <form class="form hidden" id="signupForm">
          <div>
            <label for="signupUsername">Username</label>
            <input type="text" id="signupUsername" placeholder="ragebaitslayer" required>
          </div>
          <div>
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" placeholder="you@email.com" required>
          </div>
          <div>
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" placeholder="••••••••" required>
          </div>
          <button class="btn-primary" type="submit">Create Account</button>
        </form>
      </div>

      <div id="signedIn" class="hidden">
        <div class="actions">
          <div>
            <h3 style="font-size: 14px; margin-bottom: 4px;">Signed in</h3>
            <p style="font-size: 12px; color: var(--muted);" id="userLabel">—</p>
          </div>
          <button class="btn-danger" id="logoutBtn">Log out</button>
        </div>
      </div>
    </div>

    <div class="card hidden" id="statsCard">
      <div class="stats-grid">
        <div class="stat">
          <h3>Posts analyzed</h3>
          <span id="postsAnalyzed">0</span>
        </div>
        <div class="stat">
          <h3>Avg meter</h3>
          <span id="avgMeter">—</span>
        </div>
        <div class="stat stat-wide">
          <h3>Posts left</h3>
          <span id="postsRemaining">0</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="footer-actions">
        <button class="btn-primary" id="refreshBtn">Refresh Ratings</button>
        <button class="btn-secondary" id="settingsBtn">Settings</button>
        <button class="btn-secondary" id="clearBtn">Clear Cache</button>
      </div>
      <div class="status" id="statusMsg"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
